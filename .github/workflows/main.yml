name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name PhoneBackup --collect-all arabic_reshaper phone_backup.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhoneBackup.exe
          generate_release_notes: true
